<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>火柴人大冒險：14 關彩繪世界</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1d1530;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;color:#2b2140}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#000;--u:1px;font-size:calc(var(--u)*18);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--u)*14);text-align:center;
 background:radial-gradient(circle at 15% 20%,rgba(255,196,87,.55),transparent 40%),radial-gradient(circle at 85% 25%,rgba(255,105,180,.5),transparent 42%),radial-gradient(circle at 50% 95%,rgba(80,200,255,.55),transparent 50%),rgba(255,248,231,.55);}
.hide{display:none!important}
h1{margin:0;font-size:calc(var(--u)*58);font-weight:900;letter-spacing:calc(var(--u)*4);background:linear-gradient(90deg,#ff3d6e,#ff9f1c,#2bc48a,#2b8cff,#8f4bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(calc(var(--u)*3) calc(var(--u)*3) 0 #2b2140)}
h2{margin:0 0 calc(var(--u)*8);font-size:calc(var(--u)*32);font-weight:900}
p{margin:calc(var(--u)*6) 0}
.btn{font:inherit;font-weight:900;font-size:calc(var(--u)*22);color:#2b2140;cursor:pointer;margin:calc(var(--u)*6);padding:calc(var(--u)*8) calc(var(--u)*26);
 background:linear-gradient(#ffe36e,#ffa41c);border:calc(var(--u)*3.5) solid #2b2140;border-radius:calc(var(--u)*18);box-shadow:calc(var(--u)*3) calc(var(--u)*4) 0 #2b2140}
.btn:active{transform:translate(calc(var(--u)*2),calc(var(--u)*3));box-shadow:none}
.btn.blue{background:linear-gradient(#9be3ff,#3fa7ff)}
.btn.green{background:linear-gradient(#b8f58a,#3fcf6b)}
.btn.pink{background:linear-gradient(#ffc2dc,#ff6fa8)}
.btn.sm{font-size:calc(var(--u)*17);padding:calc(var(--u)*5) calc(var(--u)*14)}
.btn:disabled{filter:grayscale(1) opacity(.55);cursor:not-allowed}
.pts{display:inline-block;background:#fff;border:calc(var(--u)*3) solid #2b2140;border-radius:calc(var(--u)*16);padding:calc(var(--u)*2) calc(var(--u)*14);font-weight:900;font-size:calc(var(--u)*22)}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(var(--u)*9);width:calc(var(--u)*880);margin:calc(var(--u)*8) 0}
.lv{font:inherit;font-weight:800;font-size:calc(var(--u)*15);line-height:1.25;cursor:pointer;padding:calc(var(--u)*8) calc(var(--u)*4);background:#fff;border:calc(var(--u)*3) solid #2b2140;border-radius:calc(var(--u)*14);box-shadow:calc(var(--u)*2) calc(var(--u)*3) 0 #2b2140;color:#2b2140}
.lv b{display:block;font-size:calc(var(--u)*20)}
.lv.boss{background:#ffd0d0}.lv.done{background:#d7ffd0}.lv.lock{background:#ddd;color:#888;cursor:not-allowed}
#shopList{width:calc(var(--u)*760);margin:calc(var(--u)*6) 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*10);background:rgba(255,255,255,.9);border:calc(var(--u)*3) solid #2b2140;border-radius:calc(var(--u)*14);padding:calc(var(--u)*6) calc(var(--u)*14);margin:calc(var(--u)*6) 0;text-align:left;box-shadow:calc(var(--u)*2) calc(var(--u)*3) 0 #2b2140}
.row .nm{font-weight:900;font-size:calc(var(--u)*22)}
.row .ds{font-size:calc(var(--u)*15);color:#5b4a7a}
.row .st{font-weight:800;font-size:calc(var(--u)*17);color:#d1307a}
#topbtn{position:absolute;top:calc(var(--u)*8);right:calc(var(--u)*8);display:none;gap:calc(var(--u)*6);z-index:5}
.playing #topbtn{display:flex}
#topbtn .btn{margin:0;padding:calc(var(--u)*2) calc(var(--u)*12);font-size:calc(var(--u)*20);border-radius:calc(var(--u)*12)}
#touch{position:absolute;inset:auto 0 calc(var(--u)*10) 0;display:none;justify-content:space-between;padding:0 calc(var(--u)*18);pointer-events:none;z-index:4}
.playing #touch{display:flex}
@media (pointer:fine){.playing #touch{display:none}}
#touch div{display:flex;gap:calc(var(--u)*14);pointer-events:auto}
#touch button{width:calc(var(--u)*92);height:calc(var(--u)*92);border-radius:50%;border:calc(var(--u)*4) solid #2b2140;background:rgba(255,255,255,.5);font-size:calc(var(--u)*30);font-weight:900;color:#2b2140;touch-action:none}
#touch button.on{background:rgba(255,200,60,.9)}
#touch .j{background:rgba(120,210,255,.55)}#touch .a{background:rgba(255,130,170,.55)}
#rot{position:fixed;inset:0;background:#1d1530;color:#fff;display:none;align-items:center;justify-content:center;font-size:5.5vw;font-weight:900;text-align:center;padding:10vw;z-index:99}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
.keys{font-size:calc(var(--u)*16);background:rgba(255,255,255,.8);border:calc(var(--u)*2) dashed #2b2140;border-radius:calc(var(--u)*10);padding:calc(var(--u)*4) calc(var(--u)*12);margin-top:calc(var(--u)*8)}
</style>
</head>
<body>
<div id="rot">📱 請把手機橫過來玩<br>（轉成橫向）</div>
<div id="stage">
 <canvas id="cv"></canvas>
 <div id="topbtn"><button class="btn sm pink" id="bMute">🔊</button><button class="btn sm" id="bPause">⏸</button><button class="btn sm blue" id="bMenu">☰</button></div>
 <div id="touch">
  <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div><button class="a" data-k="atk">👊</button><button class="j" data-k="jump">▲</button></div>
 </div>

 <div class="scr" id="sTitle">
  <h1>火柴人大冒險</h1>
  <p style="font-size:calc(var(--u)*24);font-weight:800">14 個彩繪世界・打倒兩隻大魔王！</p>
  <p>你的點數：<span class="pts" id="tPts">0</span></p>
  <div>
   <button class="btn green" id="bStart">▶ 開始冒險</button>
   <button class="btn blue" id="bShop">🛒 商店</button>
   <button class="btn pink" id="bMute2">🔊 聲音</button>
  </div>
  <div class="keys">電腦：← → 移動　↑ 或 空白鍵 跳　J / X 出拳　P 暫停<br>連按出拳＝三連擊　跳起來出拳＝飛踢　手機：用螢幕上的按鈕</div>
 </div>

 <div class="scr hide" id="sSelect">
  <h2>選擇關卡</h2>
  <div>你的點數：<span class="pts" id="sPts">0</span></div>
  <div id="grid"></div>
  <button class="btn blue" id="bSelBack">← 回首頁</button>
 </div>

 <div class="scr hide" id="sPrep">
  <h2 id="prepTitle">出發前準備</h2>
  <div>你的點數：<span class="pts" id="prepPts">0</span>　<span id="prepEq" style="font-weight:900"></span></div>
  <div id="shopList"></div>
  <p style="font-size:calc(var(--u)*15)">※ 每一關只能帶 1 個道具。第一次通過關卡可得 2 點。</p>
  <div>
   <button class="btn blue" id="bPrepBack">← 選關</button>
   <button class="btn green" id="bGo">出發！ ▶</button>
  </div>
 </div>

 <div class="scr hide" id="sResult">
  <h2 id="resTitle"></h2>
  <p id="resText" style="font-size:calc(var(--u)*22);font-weight:800"></p>
  <div>
   <button class="btn green" id="bNext">下一關 ▶</button>
   <button class="btn" id="bRetry">再玩一次</button>
   <button class="btn blue" id="bResSel">選關</button>
  </div>
 </div>
</div>

<script>
(()=>{
'use strict';
const W=960,H=540,GY=450;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const stage=$('stage');
function fit(){const w=Math.min(innerWidth,innerHeight*16/9);stage.style.width=w+'px';stage.style.height=(w*9/16)+'px';stage.style.setProperty('--u',(w/960)+'px');}
addEventListener('resize',fit);fit();

/* ---------- 工具 ---------- */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=k=>{const v=Math.sin(k*12.9898)*43758.5453;return v-Math.floor(v);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function bl(g,cx,cy,rx,ry,col,seed,alpha){g.save();g.globalAlpha=alpha==null?1:alpha;g.fillStyle=col;g.beginPath();const n=16;for(let k=0;k<=n;k++){const a=k/n*6.2832,m=1+.1*Math.sin(a*3+seed)+.07*Math.cos(a*5+seed*2),x=cx+Math.cos(a)*rx*m,y=cy+Math.sin(a)*ry*m;k?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();g.fill();g.restore();}
function ln(g,x1,y1,x2,y2,w,col,a){g.save();g.globalAlpha=a==null?1:a;g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore();}

/* ---------- 關卡資料（L1~L14） ---------- */
const LV=[
{n:'土地',sky:['#8fd3ff','#ffeab5'],gr:'#a8743f',gr2:'#6e4526',ac:'#f08a3c',mon:'#c4793a',mech:'none'},
{n:'雷電世界',sky:['#2b2d5c','#7a69dd'],gr:'#4b4f7a',gr2:'#2d2f55',ac:'#ffe14a',mon:'#8d7be6',mech:'thunder'},
{n:'火焰',sky:['#ff6a3d','#ffd36b'],gr:'#6a2e1a',gr2:'#3a160c',ac:'#ff3b1f',mon:'#e8451e',mech:'fire'},
{n:'晚上',sky:['#0d1230','#2f3680'],gr:'#2c3a5a',gr2:'#1a2440',ac:'#ffe9a0',mon:'#9a8bf0',mech:'dark'},
{n:'水裡',sky:['#59ccff','#0a68b0'],gr:'#dcc88a',gr2:'#b79d5a',ac:'#7ff0ff',mon:'#ff7aa8',mech:'water'},
{n:'草地',sky:['#a6e86a','#f1ffc2'],gr:'#4caf50',gr2:'#2e7d32',ac:'#ff8fb1',mon:'#f2a33a',mech:'grass'},
{n:'大魔王・泥土怪物',boss:'mud',sky:['#d9b27a','#7a5230'],gr:'#6b4a2b',gr2:'#3f2a16',ac:'#9a6a3a',mon:'#7b4a26',mech:'mud'},
{n:'磁鐵',sky:['#ffd0d0','#cfd8ff'],gr:'#b04a4a',gr2:'#7a2e2e',ac:'#e53935',mon:'#5c6bc0',mech:'magnet'},
{n:'金屬',sky:['#d6dee2','#8fa3ad'],gr:'#78909c',gr2:'#455a64',ac:'#eceff1',mon:'#607d8b',mech:'saw'},
{n:'冰凍世界',sky:['#c9f1ff','#f4fdff'],gr:'#b6eaff',gr2:'#6fc3e8',ac:'#ffffff',mon:'#4fa3d9',mech:'ice'},
{n:'餅乾世界',sky:['#ffd9a8','#ffb6c9'],gr:'#d29555',gr2:'#8b5a2b',ac:'#6b3a1e',mon:'#a0522d',mech:'cookie'},
{n:'窗戶世界',sky:['#bfe3ff','#fff7d6'],gr:'#b58863',gr2:'#7e5a3c',ac:'#4aa3ff',mon:'#7aa7c7',mech:'gate'},
{n:'外太空',sky:['#05051a','#2f0f57'],gr:'#6a5a8a',gr2:'#3d3260',ac:'#ffd84a',mon:'#44e0b0',mech:'space'},
{n:'大魔王・外星人',boss:'alien',sky:['#05051a','#40106b'],gr:'#5a4a7a',gr2:'#2f2650',ac:'#7dff9a',mon:'#44e0b0',mech:'alien'}
];
const ITEMS=[
{id:'jump',code:'S1',name:'跳高',cost:4,desc:'跳得更高，可以跳上高處'},
{id:'speed',code:'S2',name:'速度',cost:4,desc:'跑得更快'},
{id:'pierce',code:'S3',name:'穿透',cost:4,desc:'可以穿過牆壁和障礙'},
{id:'inv',code:'S4',name:'無敵',cost:10,desc:'連續 3 關都不會扣血'}
];
const ITEM_NAME={none:'沒帶道具',jump:'跳高',speed:'速度',pierce:'穿透',inv:'無敵'};

/* ---------- 存檔 ---------- */
let save={pts:0,cleared:[],owned:{jump:false,speed:false,pierce:false},invStock:0,invActive:0,equip:'none'};
try{const s=localStorage.getItem('stick14');if(s){const o=JSON.parse(s);save=Object.assign(save,o);save.owned=Object.assign({jump:false,speed:false,pierce:false},o.owned||{});}}catch(e){}
function persist(){try{localStorage.setItem('stick14',JSON.stringify(save));}catch(e){}}

/* ---------- 背景（彩繪） ---------- */
const bgCache={};
function getBg(i){
 if(bgCache[i])return bgCache[i];
 const L=LV[i],c=document.createElement('canvas');c.width=1920;c.height=H;const g=c.getContext('2d');const r=rng(i*31+7);
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,L.sky[0]);gr.addColorStop(1,L.sky[1]);g.fillStyle=gr;g.fillRect(0,0,1920,H);
 const wrap=fn=>{for(const dx of[-1920,0,1920]){g.save();g.translate(dx,0);fn();g.restore();}};
 const dabs=[];for(let k=0;k<90;k++)dabs.push({x:r()*1920,y:r()*H,rx:40+r()*120,ry:8+r()*22,a:.05+r()*.12,c:r()<.5?'#ffffff':L.ac,s:r()*9});
 wrap(()=>dabs.forEach(d=>bl(g,d.x,d.y,d.rx,d.ry,d.c,d.s,d.a)));
 [[L.gr,.33,300,2,0],[L.gr2,.45,365,3,1.7]].forEach(([col,al,base,fr,ph])=>{g.globalAlpha=al;g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=1920;x+=16){const y=base+Math.sin(x/1920*6.2832*fr+ph)*42+Math.sin(x/1920*6.2832*fr*3+ph*2)*12;g.lineTo(x,y);}g.lineTo(1920,H);g.closePath();g.fill();g.globalAlpha=1;});
 const m=L.mech,N=(n,f)=>{const a=[];for(let k=0;k<n;k++)a.push(f(k));return a;};
 if(m==='none'||m==='grass'){const cl=N(9,()=>({x:r()*1920,y:40+r()*140,s:.7+r()*.8}));wrap(()=>cl.forEach(o=>{bl(g,o.x,o.y,60*o.s,22*o.s,'#fff',o.x,.85);bl(g,o.x+40*o.s,o.y-10*o.s,40*o.s,22*o.s,'#fff',o.y,.85);bl(g,o.x-40*o.s,o.y-6*o.s,38*o.s,18*o.s,'#fff',o.x*2,.8);}));
  bl(g,1500,90,46,46,'#fff3a0',1,.95);bl(g,1500,90,70,70,'#fff3a0',2,.25);
  if(m==='grass'){const fl=N(60,()=>({x:r()*1920,y:380+r()*60,c:['#ff6fa8','#ffd23f','#ffffff','#ff9f1c'][r()*4|0]}));wrap(()=>fl.forEach(o=>{ln(g,o.x,o.y,o.x,o.y+22,3,'#2e7d32');bl(g,o.x,o.y,7,7,o.c,o.x);}));}}
 else if(m==='thunder'){const cl=N(8,()=>({x:r()*1920,y:50+r()*90,s:.9+r()*.8}));wrap(()=>cl.forEach(o=>{bl(g,o.x,o.y,80*o.s,30*o.s,'#14122e',o.x,.85);bl(g,o.x+50*o.s,o.y-10,50*o.s,26*o.s,'#231f4d',o.y,.9);}));
  const bo=N(7,()=>({x:r()*1920,y:100+r()*40}));wrap(()=>bo.forEach(o=>{g.strokeStyle=L.ac;g.lineWidth=5;g.lineCap='round';g.lineJoin='round';g.globalAlpha=.8;g.beginPath();g.moveTo(o.x,o.y);g.lineTo(o.x-18,o.y+60);g.lineTo(o.x+8,o.y+70);g.lineTo(o.x-14,o.y+150);g.stroke();g.globalAlpha=1;}));}
 else if(m==='fire'){const fl=N(40,()=>({x:r()*1920,h:70+r()*150,w:26+r()*30}));wrap(()=>fl.forEach(o=>{bl(g,o.x,H-o.h/2+30,o.w,o.h/2+10,'#ff5a1f',o.x,.55);bl(g,o.x,H-o.h/3+30,o.w*.6,o.h/3,'#ffb627',o.h,.7);bl(g,o.x,H-o.h/5+30,o.w*.3,o.h/5,'#fff0a0',o.w,.8);}));bl(g,400,110,70,70,'#fff0a0',3,.9);}
 else if(m==='dark'||m==='space'||m==='alien'){const st=N(160,()=>({x:r()*1920,y:r()*330,r:1+r()*2.2}));wrap(()=>st.forEach(o=>{bl(g,o.x,o.y,o.r,o.r,'#fff',o.x,.5+o.r*.15);}));
  if(m==='dark'){bl(g,1400,100,50,50,'#fff7c8',1,.95);bl(g,1400,100,90,90,'#fff7c8',2,.2);}
  else{const pl=N(3,k=>({x:300+k*640,y:90+r()*150,r:30+r()*40,c:['#ff9f6e','#6ec6ff','#c58bff'][k]}));wrap(()=>pl.forEach(o=>{bl(g,o.x,o.y,o.r,o.r,o.c,o.x,.95);bl(g,o.x+o.r*.25,o.y-o.r*.2,o.r*.55,o.r*.4,'#fff',o.y,.2);g.save();g.strokeStyle='#fff';g.globalAlpha=.55;g.lineWidth=4;g.beginPath();g.ellipse(o.x,o.y,o.r*1.7,o.r*.35,-.3,0,6.3);g.stroke();g.restore();}));}}
 else if(m==='water'){const bu=N(70,()=>({x:r()*1920,y:r()*400,r:4+r()*14}));wrap(()=>bu.forEach(o=>{g.save();g.strokeStyle='#e8ffff';g.globalAlpha=.6;g.lineWidth=3;g.beginPath();g.arc(o.x,o.y,o.r,0,6.3);g.stroke();g.restore();}));
  const ra=N(8,()=>({x:r()*1920,w:30+r()*60}));wrap(()=>ra.forEach(o=>{g.save();g.globalAlpha=.12;g.fillStyle='#fff';g.beginPath();g.moveTo(o.x,0);g.lineTo(o.x+o.w,0);g.lineTo(o.x+o.w-120,H);g.lineTo(o.x-120,H);g.fill();g.restore();}));
  const fi=N(10,()=>({x:r()*1920,y:100+r()*250,c:['#ff9f1c','#ff6fa8','#ffe36e'][r()*3|0]}));wrap(()=>fi.forEach(o=>{bl(g,o.x,o.y,22,11,o.c,o.x,.9);g.fillStyle=o.c;g.beginPath();g.moveTo(o.x+18,o.y);g.lineTo(o.x+38,o.y-12);g.lineTo(o.x+38,o.y+12);g.fill();bl(g,o.x-10,o.y-3,3,3,'#222',1);}));}

function startAttack(){
 const p=G.p,lv=G.lv;p.swing++;
 if(!p.on){p.kind='kick';p.atk=p.atkDur=16;p.cd=22;p.vx+=p.face*2.5;sfx('kick');}
 else{p.combo=(G.t-p.lastAtk<30)?(p.combo+1)%3:0;
  if(p.combo===2){p.kind='p3';p.atk=p.atkDur=16;p.cd=26;p.vx+=p.face*4;sfx('punch3');}
  else{p.kind=p.combo?'p2':'p1';p.atk=p.atkDur=10;p.cd=11;sfx('punch');}}
 p.lastAtk=G.t;
 for(const e of lv.enemies){const dx=(e.x+e.w/2)-(p.x+11);
  if(e.on&&e.stun<=0&&dx*p.face>0&&Math.abs(dx)<120&&Math.random()<DODGE){e.dodge=p.swing;e.vy=-9.5;e.kx=p.face*5.5;e.on=false;text(e.x+e.w/2,e.y-12,'閃！','#7fe0ff');sfx('dodge');}}
}
function attackHits(){
 const p=G.p,lv=G.lv,L=lv.L,el=p.atkDur-p.atk,kick=p.kind==='kick',big=p.kind==='p3'||kick;
 if(el<2||(!kick&&el>8))return;
 const reach=p.kind==='p3'?60:kick?54:48,cx=p.x+11;
 const hb={x:p.face>0?cx:cx-reach,y:kick?p.y+16:p.y+2,w:reach,h:kick?48:46};
 for(const e of lv.enemies){
  if(e.dead||e.hitSwing===p.swing||e.dodge===p.swing||!hit(hb,e))continue;
  e.hitSwing=p.swing;e.hp-=big?2:1;e.kx=p.face*(big?11:7);e.vy=-(big?7:4.5);e.on=false;e.stun=24;e.flash=8;
  impact(e.x+e.w/2-p.face*8,e.y+e.h/2,big);text(e.x+e.w/2,e.y-12,big?'砰！！':'碰！',big?'#ff8a3d':'#ffe36e',big);sfx(big?'bighit':'hit');
  if(e.hp<=0)killFoe(e,L.mon);
 }
 const b=lv.boss;
 if(b&&b.hp>0&&b.ifr<=0&&hit(hb,b)){
  b.hp=Math.max(0,b.hp-10);b.ifr=28;b.stun=26;b.flash=10;
  if(b.kind==='mud')b.x=clamp(b.x+p.face*34,lv.len-700,lv.len-130);
  const ix=p.face>0?Math.max(b.x,cx+reach*.6):Math.min(b.x+b.w,cx-reach*.6),iy=clamp(p.y+24,b.y+10,b.y+b.h-10);

  if(b.hp<=0){G.bossDead=true;G.bossT=0;burst(b.x+b.w/2,b.y+b.h/2,'#ffd23f',60,8);burst(b.x+b.w/2,b.y+b.h/2,'#ff4d6d',40,6);lv.eproj.length=0;sfx('bossdie');G.shake=14;}
 }
}

 const lv=G.lv,p=G.p,L=lv.L,m=L.mech;
 if(G.over){G.t++;G.endT++;if(G.endT===70)showResult();updateFx();return;}
 if(G.hitstop>0){G.hitstop--;return;}
 G.t++;const ph=phys();
 const dir=(keys.right?1:0)-(keys.left?1:0);
 let sp=ph.sp;for(const z of lv.zones){if(p.on&&p.x+p.w>z.x&&p.x<z.x+z.w)sp*=.5;}
 p.vx+=(dir*sp-p.vx)*ph.acc;if(!dir&&Math.abs(p.vx)<.02)p.vx=0;
 if(dir&&p.atk<=0)p.face=dir;
 let ext=0;
 for(const mg2 of lv.magnets){const dx=mg2.x-(p.x+11);if(Math.abs(dx)<280)ext+=Math.sign(dx)*(1.9*(1-Math.abs(dx)/280)+.2);}
 if(keys.jump&&p.on){p.vy=ph.jv;p.on=false;sfx('jump');}
 p.vy=Math.min(p.vy+ph.g,ph.tv);
 const pierce=G.item==='pierce';
 p.x=clamp(p.x+p.vx+ext,0,lv.len-p.w);
 if(!pierce)for(const s of solids()){if(hit(p,s)){if(p.x+p.w/2<s.x+s.w/2)p.x=s.x-p.w;else p.x=s.x+s.w;p.vx=0;}}
 const pb=p.y+p.h,pt=p.y;
 p.y+=p.vy;p.on=false;
 if(p.y+p.h>=GY){p.y=GY-p.h;p.vy=0;p.on=true;}
 for(const pl of lv.plats){if(p.vy>=0&&p.x+p.w>pl.x&&p.x<pl.x+pl.w&&pb<=pl.y+1&&p.y+p.h>=pl.y){p.y=pl.y-p.h;p.vy=0;p.on=true;}}
 if(!pierce)for(const s of solids()){if(hit(p,s)){if(pb<=s.y+1){p.y=s.y-p.h;p.vy=0;p.on=true;}else if(pt>=s.y+s.h-1){p.y=s.y+s.h;p.vy=Math.max(p.vy,0);}}}
 if(p.inv>0)p.inv--;
 if(p.cd>0)p.cd--;
 if(Math.abs(p.vx)>.3&&p.on)p.walk+=Math.abs(p.vx)*.09;
 // 徒手攻擊
 if(keys.atk&&p.cd<=0&&p.atk<=0)startAttack();
 if(p.atk>0){if(p.kind==='kick'&&p.on&&p.atk<p.atkDur-2)p.atk=0;else{attackHits();p.atk--;}}
 // 小怪：巡邏、隨機跳動、被打飛
 for(const e of lv.enemies){
  if(e.flash>0)e.flash--;

  e.x+=e.kx;e.kx*=.86;e.x=clamp(e.x,0,lv.len-e.w);
  if(e.x<e.x0)e.dir=1;if(e.x>e.x1)e.dir=-1;

 }

 // 關卡機關
 for(const h of lv.hz)if(hit(p,h))hurt(3);
 for(const s of lv.saws){s.x+=s.dir*s.spd;if(s.x<s.x0)s.dir=1;if(s.x>s.x1)s.dir=-1;s.a+=.25;if(Math.abs(s.x-(p.x+11))<22+11&&p.y+p.h>GY-44)hurt(3);}
 if(m==='thunder'&&G.t%110===0)lv.strikes.push({x:clamp(p.x+(Math.random()-.5)*500,40,lv.len-40),t:0});
 for(const s of lv.strikes){s.t++;if(s.t===60){G.flash=8;G.shake=5;burst(s.x,GY-6,'#ffe14a',16,5);sfx('thunder');if(Math.abs(p.x+11-s.x)<30)hurt(3);}}
 lv.strikes=lv.strikes.filter(s=>s.t<80);
 if(m==='space'&&G.t%55===0)lv.meteors.push({x:G.cam+Math.random()*W+200,y:-30,vx:-3,vy:5.5});
 for(const o of lv.meteors){o.x+=o.vx;o.y+=o.vy;if(o.y>GY-8){o.dead=1;burst(o.x,GY-8,'#ff9f1c',10,4);}else if(hit(p,{x:o.x-14,y:o.y-14,w:28,h:28})){o.dead=1;burst(o.x,o.y,'#ff9f1c',10,4);hurt(3);}}
 lv.meteors=lv.meteors.filter(o=>!o.dead);
 if(m==='water'&&G.t%8===0)lv.parts.push({x:G.cam+Math.random()*W,y:H,vx:0,vy:-1.4-Math.random(),life:140,col:'rgba(255,255,255,.7)',r:2+Math.random()*5,g:-.002});
 // 大魔王
 const b=lv.boss;
 if(b&&b.hp>0){
  if(b.flash>0)b.flash--;if(b.ifr>0)b.ifr--;

  else{b.t++;

   }else{
    b.x=lv.len-320+Math.sin(b.t*.02)*190;b.y=GY-155+Math.sin(b.t*.045)*50;
    const rate=b.hp<=50?55:85;
    if(b.t%rate===0){const a=Math.atan2((p.y+27)-(b.y+45),(p.x+11)-(b.x+55)),angs=b.hp<=50?[a-.28,a,a+.28]:[a];
     for(const an of angs)lv.eproj.push({x:b.x+55,y:b.y+55,vx:Math.cos(an)*5,vy:Math.sin(an)*5,r:11,c:'#7dff9a'});}
    if(b.t%520===0&&lv.enemies.length<2)lv.enemies.push(mkFoe(b.x,0,Math.random,1.1,b.x-420,b.x+60));
   }
  }
  if(b.kind==='mud'){b.vy+=.6;b.y+=b.vy;if(b.y>=GY-b.h){if(b.vy>3){G.shake=7;sfx('thud');burst(b.x+60,GY-4,'#7b4a26',14,5);}b.y=GY-b.h;b.vy=0;}}
  if(b.stun<=0&&hit(p,b)&&G.item!=='inv')hurt(10);
 }
 for(const e of lv.eproj){e.x+=e.vx;e.y+=e.vy;if(hit(p,{x:e.x-e.r,y:e.y-e.r,w:e.r*2,h:e.r*2})){e.dead=1;burst(e.x,e.y,e.c,10,4);hurt(10);}else if(e.x<-30||e.x>lv.len+30||e.y<-40||e.y>H+40)e.dead=1;}
 lv.eproj=lv.eproj.filter(e=>!e.dead);
 if(b&&G.bossDead){G.bossT++;if(G.bossT>90)winLevel();}
 if(!b&&p.x+p.w>=lv.flagX)winLevel();
 G.cam=clamp(p.x-W*.4,0,lv.len-W);
 if(G.flash>0)G.flash--;if(G.shake>0)G.shake--;
 updateFx();
}

  ctx.save();ctx.strokeStyle='#150f26';ctx.lineWidth=5;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x+30+wob,y+90);for(let k=1;k<=6;k++)ctx.lineTo(x+30+k*10+wob,y+90+(k%2?12:0));ctx.stroke();ctx.restore();
 }else{

  ctx.save();const bg=ctx.createLinearGradient(0,y+70,0,GY);bg.addColorStop(0,'rgba(125,255,154,.3)');bg.addColorStop(1,'rgba(125,255,154,0)');ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(cx-22,y+76);ctx.lineTo(cx+22,y+76);ctx.lineTo(cx+52,GY);ctx.lineTo(cx-52,GY);ctx.fill();ctx.restore();
  ball(ctx,cx,y+46+hv,27,29,f?'#ffffff':'#5fe08a');
  for(const s of[-1,1]){ln(ctx,cx+s*14,y+22+hv,cx+s*24,y+4+hv,3,'#150f26');ball(ctx,cx+s*24,y+4+hv,5.5,5.5,'#ffe14a');}
  for(const s of[-1,1]){ctx.save();ctx.translate(cx+s*12,y+44+hv);ctx.rotate(s*.5);ball(ctx,0,0,8,13,'#14122e');ctx.restore();}
  ln(ctx,cx-8,y+64+hv,cx+8,y+64+hv,2.5,'#150f26');
  ctx.save();ctx.globalAlpha=.38;ctx.fillStyle='#bfe9ff';ctx.beginPath();ctx.ellipse(cx,y+56,44,42,0,Math.PI,0);ctx.fill();ctx.globalAlpha=.7;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,y+56,36,Math.PI*1.15,Math.PI*1.4);ctx.stroke();ctx.restore();

function drawFx(lv,cam){
 for(const f of lv.fx){const pr=f.t/14,R=(f.big?50:32)*(.35+pr*.8),x=f.x-cam;
  ctx.save();ctx.translate(x,f.y);ctx.rotate(f.x*.01);ctx.globalAlpha=1-pr;
  ctx.beginPath();for(let k=0;k<16;k++){const a=k/16*TAU,r=k%2?R*.42:R;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();
  ctx.fillStyle=f.big?'#ffb23d':'#fff3a0';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.beginPath();for(let k=0;k<16;k++){const a=k/16*TAU,r=(k%2?R*.42:R)*.5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fillStyle='#fff';ctx.fill();
  ctx.globalAlpha=(1-pr)*.8;ctx.lineWidth=4*(1-pr)+1;ctx.strokeStyle=f.big?'#ff6a3d':'#ffe36e';ctx.beginPath();ctx.arc(0,0,R*1.25,0,TAU);ctx.stroke();ctx.restore();}

function drawTexts(lv,cam){
 ctx.save();ctx.textAlign='center';ctx.lineJoin='round';
 for(const s of lv.texts){ctx.globalAlpha=clamp(s.life/14,0,1);const sc=s.life>36?1+(s.life-36)*.08:1;ctx.font='900 '+Math.round((s.big?30:22)*sc)+'px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.lineWidth=6;ctx.strokeStyle='#150f26';ctx.strokeText(s.s,s.x-cam,s.y);ctx.fillStyle=s.c;ctx.fillText(s.s,s.x-cam,s.y);}

function drawWorld(){
 const lv=G.lv,L=lv.L,p=G.p,cam=G.cam,t=G.t;
 let off=(cam*.2)%1920;const bg=getBg(lv.i);ctx.drawImage(bg,-off,0);ctx.drawImage(bg,1920-off,0);
 off=(cam*.55)%1920;const md=getMid(lv.i);ctx.drawImage(md,-off,0);ctx.drawImage(md,1920-off,0);
 drawGround(lv,cam);
 for(const pl of lv.plats)shadow(pl.x-cam+pl.w/2+8,GY+2,pl.w*.5,.16);
 for(const z of lv.zones){ball(ctx,z.x-cam+z.w/2,GY-2,z.w/2,10,'#5a2e15');ball(ctx,z.x-cam+z.w/2-10,GY-4,z.w/3,5,'#8a4f2a',.7);}
 for(const h of lv.hz){const x=h.x-cam;ball(ctx,x+32,GY-1,38,9,'#3a160c');for(let k=0;k<4;k++){const fh=26+Math.sin(t*.25+k+h.x)*8;ball(ctx,x+8+k*16,GY-fh/2,10,fh/2+4,'#ff5a1f');ball(ctx,x+8+k*16,GY-fh/3,6,fh/3,'#ffd23f');}}
 for(const s of lv.saws){const x=s.x-cam;ln(ctx,s.x0-cam,GY-3,s.x1-cam,GY-3,5,'#263238',.6);shadow(x,GY+2,24,.3);ctx.save();ctx.translate(x,GY-22);ctx.rotate(s.a);ctx.beginPath();for(let k=0;k<16;k++){const a=k/16*TAU,r=k%2?15:24;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fillStyle='#cfd8dc';ctx.fill();ctx.strokeStyle='#150f26';ctx.lineWidth=2.5;ctx.stroke();ctx.restore();ball(ctx,x,GY-22,15,15,'#b0bec5');ball(ctx,x,GY-22,5,5,'#546e7a');}
 for(const m of lv.magnets){const x=m.x-cam;ctx.save();ctx.translate(x,m.y);ctx.lineCap='butt';ctx.lineWidth=22;ctx.strokeStyle='#150f26';ctx.beginPath();ctx.arc(0,0,26,Math.PI,0);ctx.stroke();ctx.lineWidth=18;ctx.strokeStyle='#e53935';ctx.beginPath();ctx.arc(0,0,26,Math.PI,0);ctx.stroke();ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(0,0,30,Math.PI*1.1,Math.PI*1.6);ctx.stroke();
  ctx.lineWidth=18;ctx.strokeStyle='#e8ecf4';ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(-26,24);ctx.moveTo(26,0);ctx.lineTo(26,24);ctx.stroke();
  ctx.strokeStyle='rgba(120,90,255,.45)';ctx.lineWidth=3;ctx.setLineDash([6,8]);ctx.lineDashOffset=-t*.6;for(let k=1;k<=2;k++){ctx.beginPath();ctx.arc(0,18,60*k,0,TAU);ctx.stroke();}ctx.restore();}
 for(const w of lv.walls)box3d(w.x-cam,w.y,w.w,w.h,12,L.gr2==='#3f2a16'?'#8a6a45':L.gr);
 for(const g of lv.gates){const closed=((t+g.ph)%g.per)<g.per*.55;box3d(g.x-cam,g.y,g.w,g.h,12,'#8fd0ff',closed?.92:.2);if(closed)for(let k=1;k<4;k++)ln(ctx,g.x-cam+4,g.y+k*g.h/4,g.x-cam+g.w-4,g.y+k*g.h/4,2,'#fff',.7);}
 for(const pl of lv.plats)box3d(pl.x-cam,pl.y,pl.w,pl.h,10,L.gr);
 if(!lv.boss){const fx=lv.flagX-cam;shadow(fx,GY+2,16,.3);limb(ctx,fx,GY,fx,GY-150,6,'#d8dde8');ball(ctx,fx,GY-154,7,7,'#ffd23f');ctx.fillStyle='#ff3d6e';ctx.beginPath();ctx.moveTo(fx+3,GY-148);ctx.quadraticCurveTo(fx+30,GY-138+Math.sin(t*.15)*6,fx+56,GY-123);ctx.quadraticCurveTo(fx+30,GY-116+Math.sin(t*.15)*6,fx+3,GY-98);ctx.fill();ctx.strokeStyle='#150f26';ctx.lineWidth=2.5;ctx.stroke();}
 for(const s of lv.strikes){const x=s.x-cam;if(s.t<60){ctx.save();ctx.strokeStyle='#ffe14a';ctx.setLineDash([8,8]);ctx.globalAlpha=.4+.4*Math.sin(s.t*.4);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GY);ctx.stroke();ctx.restore();ball(ctx,x,GY-2,30,7,'#ffe14a',.5);}
  else{ctx.save();ctx.strokeStyle='#fff9a8';ctx.lineWidth=12;ctx.lineJoin='round';ctx.shadowColor='#ffe14a';ctx.shadowBlur=24;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x-16,110);ctx.lineTo(x+14,200);ctx.lineTo(x-12,320);ctx.lineTo(x,GY);ctx.stroke();ctx.restore();}}
 for(const e of lv.enemies)drawFoe(e,cam,t,L.mon);
 if(lv.boss&&lv.boss.hp>0)drawBoss(lv.boss,cam,t);
 for(const o of lv.meteors){const x=o.x-cam;ln(ctx,x,o.y,x+o.vx*-9,o.y-o.vy*9,10,'#ffb627',.5);ball(ctx,x,o.y,15,15,'#c0603a');}
 for(const e of lv.eproj){const x=e.x-cam;ball(ctx,x,e.y,e.r+5,e.r+5,e.c,.3);ball(ctx,x,e.y,e.r,e.r,e.c);}
 if(!(G.over&&!G.win)){const sy=p.on?p.y+p.h+2:GY+2;shadow(p.x+11-cam,sy,16*clamp(1-(GY-p.y-p.h)/260,.4,1),.32);drawPlayer(p,cam,G.item,t);}
 drawFx(lv,cam);
 for(const q of lv.parts){ctx.globalAlpha=clamp(q.life/30,0,1);bl(ctx,q.x-cam,q.y,q.r,q.r,q.col,q.x);}ctx.globalAlpha=1;
 if(L.mech==='water'){ctx.fillStyle='rgba(0,110,200,.12)';ctx.fillRect(0,0,W,H);}
 if(L.mech==='dark'){const px=p.x+11-cam,py=p.y+27,g=ctx.createRadialGradient(px,py,40,px,py,300);g.addColorStop(0,'rgba(0,0,22,0)');g.addColorStop(.4,'rgba(0,0,22,.35)');g.addColorStop(1,'rgba(0,0,22,.95)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const e of lv.enemies){const x=e.x-cam+e.w/2;if(x>-20&&x<W+20){bl(ctx,x-7,e.y+12,4,4,'#fff',1,.9);bl(ctx,x+7,e.y+12,4,4,'#fff',1,.9);}}}
 drawTexts(lv,cam);
 ctx.drawImage(getVig(),0,0);
 if(G.flash>0){ctx.fillStyle='rgba(255,255,220,'+(G.flash/12)+')';ctx.fillRect(0,0,W,H);}
}
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
function hud(){
 const p=G.p,lv=G.lv;
 ctx.save();ctx.font='900 18px '+FONT;ctx.textBaseline='middle';
 rr(ctx,14,14,230,26,13);ctx.fillStyle='rgba(43,33,64,.65)';ctx.fill();
 const gr=ctx.createLinearGradient(14,0,244,0);gr.addColorStop(0,'#ff4d6d');gr.addColorStop(1,'#ffb627');
 if(p.hp>0){rr(ctx,17,17,Math.max(14,224*p.hp/100),20,10);ctx.fillStyle=gr;ctx.fill();rr(ctx,20,19,Math.max(8,218*p.hp/100),6,3);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();}
 ctx.fillStyle='#fff';ctx.fillText('❤ '+p.hp,26,28);
 rr(ctx,14,46,230,24,12);ctx.fillStyle='rgba(255,255,255,.75)';ctx.fill();ctx.fillStyle='#2b2140';ctx.font='900 15px '+FONT;
 let it=ITEM_NAME[G.item];if(G.item==='inv')it+='（還有 '+save.invActive+' 關）';
 ctx.fillText('L'+(lv.i+1)+' '+lv.L.n+'｜'+it,22,58);
 const b=lv.boss;
 if(b){rr(ctx,330,14,300,24,12);ctx.fillStyle='rgba(43,33,64,.7)';ctx.fill();if(b.hp>0){rr(ctx,333,17,Math.max(10,294*b.hp/100),18,9);ctx.fillStyle='#8f4bff';ctx.fill();}ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('大魔王 '+b.hp+' / 100',480,26);ctx.textAlign='left';}
 else{const prog=clamp(G.p.x/lv.flagX,0,1);rr(ctx,330,20,300,12,6);ctx.fillStyle='rgba(43,33,64,.5)';ctx.fill();ball(ctx,330+300*prog,26,9,9,'#ffd23f');}
 if(G.t<110){ctx.globalAlpha=G.t<80?1:(110-G.t)/30;ctx.font='900 54px '+FONT;ctx.textAlign='center';ctx.lineWidth=8;ctx.lineJoin='round';ctx.strokeStyle='#2b2140';ctx.fillStyle='#fff';const tx='第 '+(lv.i+1)+' 關・'+lv.L.n;ctx.strokeText(tx,W/2,170);ctx.fillText(tx,W/2,170);ctx.globalAlpha=1;}
 if(G.t<420&&(lv.i===0||lv.boss)){ctx.globalAlpha=G.t<380?1:(420-G.t)/40;ctx.textAlign='center';ctx.font='900 20px '+FONT;const tx=lv.boss?(lv.boss.kind==='alien'?'外星人會飛：跳起來用飛踢打牠！':'靠近大魔王出拳，打中 10 次就贏！'):'靠近怪物出拳 👊　連按＝三連擊　跳起來出拳＝飛踢';
  const tw=ctx.measureText(tx).width+36;rr(ctx,W/2-tw/2,92,tw,34,17);ctx.fillStyle='rgba(43,33,64,.72)';ctx.fill();ctx.fillStyle='#fff';ctx.fillText(tx,W/2,110);ctx.globalAlpha=1;}
 ctx.restore();
 if(G.paused){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 50px '+FONT;ctx.textAlign='center';ctx.fillText('⏸ 暫停中',W/2,H/2-6);ctx.font='700 22px sans-serif';ctx.fillText('按 ⏸ 或 P 繼續',W/2,H/2+36);ctx.textAlign='left';}
}
function render(){
 ctx.clearRect(0,0,W,H);
 if(screen==='play'&&G){
  ctx.save();if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*1.6,(Math.random()-.5)*G.shake*1.6);
  drawWorld();ctx.restore();hud();
 }else{
  idleT+=1;const li=screen==='Result'&&G?G.i:0;let off=(idleT*.3)%1920;const bg=getBg(li);ctx.drawImage(bg,-off,0);ctx.drawImage(bg,1920-off,0);
  off=(idleT*.8)%1920;const md=getMid(li);ctx.drawImage(md,-off,0);ctx.drawImage(md,1920-off,0);
 }
}

/* ---------- 介面 ---------- */
function show(name){
 screen=name;
 for(const s of document.querySelectorAll('.scr'))s.classList.toggle('hide',s.id!=='s'+name);
 stage.classList.toggle('playing',name==='play');
 if(name==='Title')$('tPts').textContent=save.pts;
 if(name==='Select')renderSelect();
 if(name==='Prep')renderPrep();
}
const unlocked=i=>i===0||save.cleared.includes(i-1)||save.cleared.includes(i);
function firstOpen(){for(let i=0;i<14;i++)if(!save.cleared.includes(i))return i;return 13;}
function renderSelect(){
 $('sPts').textContent=save.pts;const g=$('grid');g.innerHTML='';
 LV.forEach((L,i)=>{const b=document.createElement('button');const ok=unlocked(i),done=save.cleared.includes(i);
  b.className='lv'+(L.boss?' boss':'')+(done?' done':'')+(ok?'':' lock');
  b.innerHTML='<b>L'+(i+1)+(L.boss?' 👹':'')+(done?' ★':'')+(ok?'':' 🔒')+'</b>'+L.n;
  b.onclick=()=>{if(!ok)return;cur=i;show('Prep');};g.appendChild(b);});
}
function renderPrep(){
 const L=LV[cur];$('prepTitle').textContent='L'+(cur+1)+'　'+L.n+(L.boss?' 👹':'');$('prepPts').textContent=save.pts;
 const eq=save.invActive>0?'無敵（剩 '+save.invActive+' 關）':ITEM_NAME[(save.equip!=='none'&&save.owned[save.equip])?save.equip:'none'];
 $('prepEq').textContent='這一關帶：'+eq;
 const box=$('shopList');box.innerHTML='';
 ITEMS.forEach(it=>{
  const row=document.createElement('div');row.className='row';
  const info=document.createElement('div');info.innerHTML='<div class="nm">'+it.code+' '+it.name+'</div><div class="ds">'+it.desc+'</div>';
  const right=document.createElement('div');
  const mk=(txt,cls,fn,dis,snd)=>{const b=document.createElement('button');b.className='btn sm '+(cls||'');b.textContent=txt;b.disabled=!!dis;b.onclick=()=>{fn();if(snd)sfx(snd);persist();renderPrep();};right.appendChild(b);};
  const st=txt=>{const s=document.createElement('div');s.className='st';s.textContent=txt;right.appendChild(s);};
  if(it.id==='inv'){
   if(save.invActive>0)st('✨ 無敵啟動中：還剩 '+save.invActive+' 關');
   else if(save.invStock>0)mk('啟動（連續 3 關）','pink',()=>{save.invStock=0;save.invActive=3;},false,'inv');
   else mk('購買 · '+it.cost+' 點','green',()=>{save.pts-=it.cost;save.invStock=1;},save.pts<it.cost,'buy');
  }else{
   if(!save.owned[it.id])mk('購買 · '+it.cost+' 點','green',()=>{save.pts-=it.cost;save.owned[it.id]=true;},save.pts<it.cost,'buy');
   else if(save.invActive>0)st('無敵中，道具鎖定');
   else if(save.equip===it.id)mk('已帶上 ✓（取消）','pink',()=>{save.equip='none';});
   else mk('帶上','blue',()=>{save.equip=it.id;});
  }
  row.appendChild(info);row.appendChild(right);box.appendChild(row);
 });
}
function showResult(){
 const win=G.win,last=G.i===13;
 $('resTitle').textContent=win?(last?'🎉 全部通關！太厲害了！':'🎉 過關成功！'):'💥 失敗了，再試一次！';
 $('resText').textContent=win?(G.first?'第一次通過，獲得 2 點！　現在共有 '+save.pts+' 點':'已經通過過了，這次沒有點數　共有 '+save.pts+' 點'):'血量歸零了，換個道具或再挑戰看看！';
 $('bNext').style.display=(win&&!last)?'':'none';
 show('Result');
}
function togglePause(){if(screen!=='play'||!G||G.over)return;G.paused=!G.paused;}

$('bStart').onclick=()=>{cur=firstOpen();show('Select');};
$('bShop').onclick=()=>{cur=firstOpen();show('Prep');};
$('bSelBack').onclick=()=>show('Title');
$('bPrepBack').onclick=()=>show('Select');
$('bGo').onclick=()=>startLevel(cur);
$('bNext').onclick=()=>{cur=Math.min(13,G.i+1);show('Prep');};
$('bRetry').onclick=()=>show('Prep');
$('bResSel').onclick=()=>show('Select');
$('bPause').onclick=()=>{togglePause();$('bPause').blur();};
$('bMenu').onclick=()=>{show('Select');$('bMenu').blur();};
$('bMute').onclick=()=>{setMute(!save.mute);$('bMute').blur();};
$('bMute2').onclick=()=>setMute(!save.mute);
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button:not([data-k])'))sfx('click');});
setMute(!!save.mute);

const kmap={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'jump',j:'atk',J:'atk',x:'atk',X:'atk',z:'atk',Z:'atk',k:'atk',K:'atk'};
addEventListener('keydown',e=>{
 if((e.key==='p'||e.key==='P'||e.key==='Escape')&&!e.repeat){togglePause();return;}
 const k=kmap[e.key];if(k){keys[k]=1;if(screen==='play')e.preventDefault();}
});
addEventListener('keyup',e=>{const k=kmap[e.key];if(k)keys[k]=0;});
addEventListener('blur',()=>{keys.left=keys.right=keys.jump=keys.atk=0;if(G&&screen==='play'&&!G.over)G.paused=true;});
document.querySelectorAll('[data-k]').forEach(b=>{
 const k=b.dataset.k;
 const on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on');};
 const off=e=>{e.preventDefault();keys[k]=0;b.classList.remove('on');};
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));
 b.addEventListener('contextmenu',e=>e.preventDefault());
});

/* ---------- 主迴圈（固定 60 步/秒） ---------- */
let last=0,accT=0;
function loop(ts){
 requestAnimationFrame(loop);
 const dt=Math.min(100,ts-last);last=ts;accT+=dt;
 if(screen==='play'&&G&&!G.paused){while(accT>=16.667){step();accT-=16.667;}}else accT=0;
 render();
}
window.__dbg={get G(){return G;},startLevel,step,keys,save,LV,show,render,phys};
show('Title');
requestAnimationFrame(loop);
})();
